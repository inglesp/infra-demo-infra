# The droplets (GCE instances), and the apps each one runs. OpenTofu and
# Ansible both read this.
#
# droplets:
#   <droplet>:
#     zone: europe-west2-a
#     size: e2-small                 # GCE machine type
#     apps:
#       <app>:                       # unique across all droplets
#         domain: <app>.example.org  # gets its own DNS zone
#         volume_size: 10            # GB, at least 10
#         image: ghcr.io/<owner>/<image>
#         image_tag: latest
#         env:                       # the app's environment; secrets go in the droplet's vault
#           SOME_SETTING: ...
droplets:
  gcp-1:
    zone: europe-west2-a
    size: e2-small
    apps:
      delta:
        domain: delta-infra-demo.opensafely.org
        volume_size: 10
        image: ghcr.io/inglesp/infra-demo-app
        image_tag: latest
        env:
          DJANGO_ALLOWED_HOSTS: delta-infra-demo.opensafely.org
          DEMO_NON_SECRET: delta not a secret
