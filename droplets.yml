# The droplets, and the apps each one runs. OpenTofu and Ansible both read this.
#
# droplets:
#   <droplet>:
#     region: lon1
#     size: s-1vcpu-1gb
#     apps:
#       <app>:                       # unique across all droplets
#         domain: <app>.example.org  # optional: gets its own DNS zone
#         volume_size: 1             # GiB
#         image: ghcr.io/<owner>/<image>
#         image_tag: latest
#         env:                       # the app's environment; secrets go in the droplet's vault
#           SOME_SETTING: ...
#         # Optional:
#         nginx: false               # no nginx in front of the app, so no vhost, ports or TLS (default true)
#         nginx_log_format: bytes_json  # nginx access log format, defined in the web_app role's files/ (default Dokku's)
#         network: <network>         # reach other apps on the network as <app>.web
#         checks: false              # stop the old container before starting the new one (default true)
#         docker_options:            # extra `docker run` options, e.g. to publish a port on the host
#           - "-p 1234:1234"
#         mounts:                    # extra host paths, mounted read-only
#           - /host/path:/container/path
droplets:
  demo-1:
    region: lon1
    size: s-1vcpu-1gb
    apps:
      alpha:
        domain: alpha-infra-demo.opensafely.org
        volume_size: 2
        image: ghcr.io/inglesp/infra-demo-app
        image_tag: latest
        # A stand-in for the app whose traffic is managed: its access log
        # has no client IPs or URLs
        nginx_log_format: bytes_json
        env:
          DJANGO_ALLOWED_HOSTS: alpha-infra-demo.opensafely.org
          DEMO_NON_SECRET: alpha not a secret
  demo-2:
    region: lon1
    size: s-1vcpu-1gb
    apps:
      beta:
        domain: beta-infra-demo.opensafely.org
        volume_size: 1
        image: ghcr.io/inglesp/infra-demo-app
        image_tag: latest
        env:
          DJANGO_ALLOWED_HOSTS: beta-infra-demo.opensafely.org
          DEMO_NON_SECRET: beta not a secret
      gamma:
        domain: gamma-infra-demo.opensafely.org
        volume_size: 2
        image: ghcr.io/inglesp/infra-demo-app
        image_tag: sha-e64f51c0b8228d828ae3902d0314d803217fce79
        env:
          DJANGO_ALLOWED_HOSTS: gamma-infra-demo.opensafely.org
          DEMO_NON_SECRET: gamma not a secret
