- ansible.builtin.import_tasks: host.yml
- ansible.builtin.import_tasks: dokku.yml

# include_tasks, since imports can't loop
- name: Configure each app
  ansible.builtin.include_tasks: app.yml
  loop: "{{ apps | dict2items }}"
  loop_control:
    loop_var: app
    label: "{{ app.key }}"
  vars:
    app_name: "{{ app.key }}"
    domain: "{{ app.value.domain }}"
    app_env: "{{ app.value.env | combine(app_secrets[app.key]) }}"

- ansible.builtin.import_tasks: alerts.yml
# Last, since it runs the handlers before starting the deploy timer
- ansible.builtin.import_tasks: deploy.yml
