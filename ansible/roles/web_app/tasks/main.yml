- ansible.builtin.import_tasks: host.yml
- ansible.builtin.import_tasks: dokku.yml
- ansible.builtin.import_tasks: nginx.yml

# include_tasks, since imports can't loop
- name: Configure each app
  ansible.builtin.include_tasks: app.yml
  loop: "{{ apps | dict2items }}"
  loop_control:
    loop_var: app
    label: "{{ app.key }}"
  vars:
    app_name: "{{ app.key }}"
    # Optional settings: see droplets.yml. Unset strings default to '', not
    # none, since the droplets' Ansible (ansible-core 2.16) renders none as ''.
    domain: "{{ app.value.domain | default('') }}"
    app_nginx_required: "{{ app.value.nginx | default(true) }}"
    app_nginx_log_format: "{{ app.value.nginx_log_format | default('') }}"
    app_network: "{{ app.value.network | default('') }}"
    app_checks: "{{ app.value.checks | default(true) }}"
    app_docker_options: "{{ app.value.docker_options | default([]) }}"
    app_mounts: "{{ app.value.mounts | default([]) }}"
    app_env: "{{ app.value.env | combine(app_secrets[app.key]) }}"

- ansible.builtin.import_tasks: alerts.yml
# Last, since it runs the handlers before starting the deploy timer
- ansible.builtin.import_tasks: deploy.yml
