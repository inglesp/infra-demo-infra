# On a new droplet, the volume can be attached after Ansible has started
- name: Wait for the volume's device
  ansible.builtin.wait_for:
    path: "{{ volume_device }}"
    timeout: 120

# A new GCE disk is blank. This leaves a disk that already has a filesystem
# alone, so it never wipes an app's data.
- name: Create the volume's filesystem
  community.general.filesystem:
    dev: "{{ volume_device }}"
    fstype: ext4
    opts: -L data

- name: Mount the volume
  ansible.posix.mount:
    path: "{{ data_dir }}"
    src: "{{ volume_device }}"
    fstype: ext4
    # nofail, so that the droplet still boots if the volume is missing
    opts: defaults,nofail,discard,noatime
    state: mounted

- name: Give the data directory to the app's user
  ansible.builtin.file:
    path: "{{ data_dir }}"
    state: directory
    owner: "{{ app_uid }}"
    group: "{{ app_uid }}"
    mode: "0755"
