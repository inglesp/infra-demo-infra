# The apps' images, for the deploy scripts. This holds no secrets: they're in
# each app's Dokku config.
- name: Set the apps to deploy
  ansible.builtin.copy:
    content: "{{ apps | to_nice_json }}\n"
    dest: /etc/web-app/apps.json
    mode: "0644"

- name: Install the deploy scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: /usr/local/bin/{{ item }}
    mode: "0755"
  loop: [deploy, deploy-app]

- name: Install the deploy service
  ansible.builtin.copy:
    src: deploy.service
    dest: /etc/systemd/system/deploy.service
    mode: "0644"
  notify: Reload systemd

- name: Install the deploy timer
  ansible.builtin.copy:
    src: deploy.timer
    dest: /etc/systemd/system/deploy.timer
    mode: "0644"
  notify: Reload systemd

# So that systemd has loaded the deploy units before anything starts them
- name: Run handlers
  ansible.builtin.meta: flush_handlers

# A timer doesn't start its service again while it's still running, so slow
# deploys don't pile up
- name: Start the deploy timer
  ansible.builtin.systemd_service:
    name: deploy.timer
    enabled: true
    state: started
