# Dokku has no declarative config, so each setting is read first, and only
# changed when it differs.
- name: List Dokku's apps
  ansible.builtin.command: dokku --quiet apps:list
  register: dokku_apps
  changed_when: false

- name: Create the Dokku app
  ansible.builtin.command: dokku apps:create {{ app_name }}
  when: app_name not in dokku_apps.stdout_lines

# An app without a domain is only reached by other apps on the droplet, or
# through a port it publishes itself, so it keeps Dokku's default
- name: Set the app's domain
  when: domain | length > 0
  block:
    # If the app has only just been created, there's nothing to read, so the
    # domain is set regardless
    - name: Read the app's domains
      ansible.builtin.command: dokku domains:report {{ app_name }} --domains-app-vhosts
      register: dokku_app_domains
      changed_when: false
      when: app_name in dokku_apps.stdout_lines

    - name: Set the app's domain
      ansible.builtin.command: dokku domains:set {{ app_name }} {{ domain }}
      when: dokku_app_domains is skipped or dokku_app_domains.stdout.split() != [domain]

# With `nginx: false`, Dokku doesn't put nginx in front of the app (Dokku calls
# this its proxy), so the app has no vhost, ports or TLS
- name: Read whether nginx is enabled for the app
  ansible.builtin.command: dokku proxy:report {{ app_name }} --proxy-enabled
  register: dokku_app_nginx
  changed_when: false
  when: app_name in dokku_apps.stdout_lines

- name: Disable nginx for the app
  ansible.builtin.command: dokku proxy:disable {{ app_name }}
  register: dokku_app_nginx_disable
  when: not app_nginx_required and (dokku_app_nginx is skipped or dokku_app_nginx.stdout != "false")

- name: Enable nginx for the app
  ansible.builtin.command: dokku proxy:enable {{ app_name }}
  register: dokku_app_nginx_enable
  when: app_nginx_required and dokku_app_nginx is not skipped and dokku_app_nginx.stdout == "false"

- name: Set the app's ports
  when: app_nginx_required
  block:
    - name: Read whether letsencrypt is active for the app
      ansible.builtin.command: dokku letsencrypt:report {{ app_name }} --letsencrypt-active
      register: letsencrypt_active
      changed_when: false
      when: app_name in dokku_apps.stdout_lines

    # Otherwise Dokku publishes the port the image exposes, rather than 80
    - name: Read the app's port mappings
      ansible.builtin.command: dokku ports:report {{ app_name }} --ports-map
      register: dokku_app_ports
      changed_when: false
      when: app_name in dokku_apps.stdout_lines

    # Enabling letsencrypt adds a mapping for 443, and disabling it removes it
    - name: Route ports 80 and 443 to the app
      vars:
        app_ports: >-
          {{ ["http:80:" ~ app_port]
             + (["https:443:" ~ app_port] if letsencrypt_active is not skipped and letsencrypt_active.stdout == "true" else []) }}
      ansible.builtin.command: dokku ports:set {{ app_name }} {{ app_ports | join(" ") }}
      when: dokku_app_ports is skipped or dokku_app_ports.stdout.split() != app_ports

# The format is one of those defined in nginx.yml. Without `nginx_log_format`,
# the app uses Dokku's default, which logs client IPs and URLs.
- name: Set the app's nginx access log format
  when: app_nginx_required
  block:
    - name: Read the app's nginx access log format
      ansible.builtin.command: dokku nginx:report {{ app_name }} --nginx-access-log-format
      register: dokku_app_nginx_log_format
      changed_when: false
      when: app_name in dokku_apps.stdout_lines

    - name: Set the app's nginx access log format
      ansible.builtin.command: dokku nginx:set {{ app_name }} access-log-format {{ app_nginx_log_format }}
      register: dokku_app_nginx_log_format_set
      when: >-
        app_nginx_log_format | length > 0
        and (dokku_app_nginx_log_format is skipped
             or dokku_app_nginx_log_format.stdout != app_nginx_log_format)

    # With no value, nginx:set unsets the format, so the app goes back to
    # Dokku's default
    - name: Unset the app's nginx access log format
      ansible.builtin.command: dokku nginx:set {{ app_name }} access-log-format
      register: dokku_app_nginx_log_format_unset
      when: >-
        app_nginx_log_format | length == 0
        and dokku_app_nginx_log_format is not skipped
        and dokku_app_nginx_log_format.stdout | length > 0

    # The app's nginx config is otherwise only rebuilt when it's deployed. An
    # app that hasn't been deployed gets the format when it's first deployed.
    - name: Check whether the app has been deployed, to rebuild its nginx config
      ansible.builtin.command: dokku ps:report {{ app_name }} --deployed
      register: dokku_app_deployed_for_nginx
      changed_when: false
      when: dokku_app_nginx_log_format_set is changed or dokku_app_nginx_log_format_unset is changed

    - name: Rebuild the app's nginx config
      ansible.builtin.command: dokku proxy:build-config {{ app_name }}
      when: >-
        (dokku_app_nginx_log_format_set is changed or dokku_app_nginx_log_format_unset is changed)
        and dokku_app_deployed_for_nginx.stdout == "true"

# Apps on the same network reach each other as <app>.web
- name: Attach the app to its network
  when: app_network | length > 0
  block:
    - name: Check whether the network exists
      ansible.builtin.command: dokku network:exists {{ app_network }}
      register: dokku_network_exists
      changed_when: false
      failed_when: false

    - name: Create the network
      ansible.builtin.command: dokku network:create {{ app_network }}
      when: dokku_network_exists.rc != 0

    - name: Read the app's network
      ansible.builtin.command: dokku network:report {{ app_name }} --network-attach-post-create
      register: dokku_app_network
      changed_when: false
      when: app_name in dokku_apps.stdout_lines

    - name: Set the app's network
      ansible.builtin.command: dokku network:set {{ app_name }} attach-post-create {{ app_network }}
      register: dokku_app_network_set
      when: dokku_app_network is skipped or dokku_app_network.stdout.split() != [app_network]

# With checks disabled, Dokku stops the old container before starting the new
# one, rather than running both for a while. An app that publishes a port on
# the host needs this, since two containers can't both publish it.
- name: Read the app's checks
  ansible.builtin.command: dokku checks:report {{ app_name }} --checks-disabled-list
  register: dokku_app_checks
  changed_when: false
  when: app_name in dokku_apps.stdout_lines

- name: Disable the app's checks
  ansible.builtin.command: dokku checks:disable {{ app_name }}
  when: not app_checks and (dokku_app_checks is skipped or dokku_app_checks.stdout != "_all_")

- name: Enable the app's checks
  ansible.builtin.command: dokku checks:enable {{ app_name }}
  when: app_checks and dokku_app_checks is not skipped and dokku_app_checks.stdout == "_all_"

# Every app's log options (see app_log_docker_options in defaults), then its
# own from droplets.yml. Removing an option doesn't remove it from the app:
# run `dokku docker-options:remove <app> deploy "<option>"` on the droplet
- name: Read the app's docker options
  ansible.builtin.command: dokku docker-options:report {{ app_name }} --docker-options-deploy
  register: dokku_app_docker_options
  changed_when: false
  when: app_name in dokku_apps.stdout_lines

- name: Add the app's docker options
  ansible.builtin.command:
    argv: [dokku, docker-options:add, "{{ app_name }}", deploy, "{{ item }}"]
  loop: "{{ app_log_docker_options + app_docker_options }}"
  register: dokku_app_docker_options_add
  when: dokku_app_docker_options is skipped or item not in dokku_app_docker_options.stdout

- name: Read the app's storage mounts
  ansible.builtin.command: dokku --quiet storage:list {{ app_name }}
  register: dokku_app_storage
  changed_when: false
  when: app_name in dokku_apps.stdout_lines

# Mount the app's volume read-write, and any extra host paths in its `mounts`
# in droplets.yml read-only. Removing a path from `mounts` doesn't unmount it:
# run `dokku storage:unmount <app> <host path>:<container path>:ro` on the
# droplet.
- name: Mount the volume, and any other host paths, into the app's container
  ansible.builtin.command: dokku storage:mount {{ app_name }} {{ item }}
  loop: "{{ [app_storage_mount] + (app_mounts | map('regex_replace', '$', ':ro') | list) }}"
  register: dokku_app_storage_mount
  when: dokku_app_storage is skipped or item not in dokku_app_storage.stdout_lines

# A change to the app's mounts, nginx, network or docker options only reaches
# the container when it restarts. An app that hasn't been deployed can't be restarted, but gets them
# when it's first deployed.
- name: Restart the app if its container's settings changed
  vars:
    app_needs_restart: >-
      {{ dokku_app_storage_mount is changed
         or dokku_app_nginx_disable is changed
         or dokku_app_nginx_enable is changed
         or dokku_app_network_set is changed
         or dokku_app_docker_options_add is changed }}
  block:
    - name: Check whether the app has been deployed
      ansible.builtin.command: dokku ps:report {{ app_name }} --deployed
      register: dokku_app_deployed
      changed_when: false
      when: app_needs_restart | bool

    - name: Restart the app
      ansible.builtin.command: dokku ps:restart {{ app_name }}
      when: app_needs_restart | bool and dokku_app_deployed.stdout == "true"

# The environment holds secrets, so these tasks don't log their output
- name: Read the app's environment
  ansible.builtin.command: dokku config:export --format json {{ app_name }}
  register: dokku_config
  changed_when: false
  when: app_name in dokku_apps.stdout_lines
  no_log: true

# Each key is set on its own, and only if it differs, since config:set
# restarts the app. argv passes the value as it is, without splitting it.
#
# Run as root, Dokku re-runs itself through sudo, which logs the full command,
# and so the secret, to the journal, whatever no_log says. Run as dokku, it
# doesn't, and sudo only logs Ansible's wrapper, which doesn't hold the secret.
- name: Set the app's environment
  ansible.builtin.command:
    argv: [dokku, config:set, "{{ app_name }}", "{{ item.key }}={{ item.value }}"]
  become: true
  become_user: dokku
  loop: "{{ app_env | dict2items }}"
  when: dokku_config is skipped or (dokku_config.stdout | from_json).get(item.key) != item.value
  no_log: true
