# Installed by Ansible. nginx access log formats, which an app can choose with
# `nginx_log_format` in droplets.yml.
#
# 00- so that nginx reads this before dokku.conf, which includes the apps'
# vhosts: a vhost can only use a format that's already defined.

# No client IPs, URLs or query strings: just enough to count bytes.
log_format bytes_json escape=json
  '{"vhost":"$server_name","status":$status,"bytes_sent":$bytes_sent,'
  '"request_length":$request_length,"request_time":$request_time,'
  '"method":"$request_method"}';
